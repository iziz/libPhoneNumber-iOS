name: Pull Request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.scheme }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - libPhoneNumber
          - libPhoneNumberGeocoding
          - libPhoneNumberShortNumber

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve iPhone simulator destination
        id: destination
        run: |
          set -eo pipefail

          destination_id="$(
            xcrun simctl list devices --json |
              python3 -c '
                import json
                import re
                import sys

                matches = []
                for runtime, entries in json.load(sys.stdin).get("devices", {}).items():
                    runtime_match = re.match(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+)-(\d+)", runtime)
                    if not runtime_match:
                        continue

                    print(f"Runtime: {runtime} ({len(entries)} devices)", file=sys.stderr)

                    os_version = tuple(int(part) for part in runtime_match.groups())
                    for entry in entries:
                        name = (entry.get("name") or "").strip()
                        model_match = re.match(r"iPhone\s+(\d+)\b", name)
                        if entry.get("isAvailable") and entry.get("udid") and model_match:
                            matches.append((os_version, int(model_match.group(1)), name, entry["udid"]))
                            the_os = f"{os_version[0]}.{os_version[1]}"
                            print(f"  {name} (iOS {the_os}) [{entry['udid']}]", file=sys.stderr)

                if not matches:
                    raise SystemExit("No iPhone simulator destinations found")

                selected = max(matches); name = selected[2]; the_os = f"{selected[0][0]}.{selected[0][1]}"
                print(f"Selected Simulator: {name} (iOS {the_os}) [{selected[3]}]", file=sys.stderr)
                print(selected[3])
                '
          )"

          echo "destination=id=$destination_id,arch=arm64" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -eo pipefail
          mkdir -p TestResults

          xcodebuild \
            -project libPhoneNumber.xcodeproj \
            -scheme "$SCHEME" \
            -destination "${{ steps.destination.outputs.destination }}" \
            -resultBundlePath "TestResults/${SCHEME}.xcresult" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Export code coverage data
        if: always()
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -eo pipefail

          result_bundle="TestResults/${SCHEME}.xcresult"
          coverage_json="TestResults/${SCHEME}.xccov.json"

          echo "### Code Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -d "$result_bundle" ]; then
            echo "Coverage report unavailable because \`$result_bundle\` was not created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! xcrun xccov view --archive --json "$result_bundle" > "$coverage_json"; then
            echo "Coverage report unavailable because \`xccov\` could not parse \`$result_bundle\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Exported line-level coverage data for \`$SCHEME\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload code coverage data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-coverage-${{ matrix.scheme }}
          path: TestResults/${{ matrix.scheme }}.xccov.json
          if-no-files-found: ignore

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: project-unit-tests-${{ matrix.scheme }}.xcresult
          path: TestResults/${{ matrix.scheme }}.xcresult

  coverage-summary:
    name: Combined Code Coverage
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()

    steps:
      - name: Download code coverage data
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: unit-test-coverage-*
          path: CoverageData
          merge-multiple: true

      - name: Publish combined coverage summary
        run: |
          set -eo pipefail
          shopt -s nullglob

          mkdir -p CoverageData
          coverage_files=(CoverageData/*.xccov.json)
          summary_file="CoverageData/combined-coverage-summary.md"

          echo "Coverage data directory contents:"
          ls -la CoverageData || true
          echo "Coverage JSON files found: ${#coverage_files[@]}"
          for coverage_file in "${coverage_files[@]}"; do
            echo "Coverage artifact: $coverage_file"
            wc -c "$coverage_file"
          done

          if [ ${#coverage_files[@]} -eq 0 ]; then
            {
              echo "### Combined Code Coverage"
              echo
              echo "Combined coverage unavailable because no coverage data artifacts were downloaded."
            } > "$summary_file"
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - "${coverage_files[@]}" > "$summary_file" <<'PY'
          import json
          import os
          import sys

          combined = {}
          per_scheme = []

          for path in sys.argv[1:]:
              print(f"Parsing coverage file: {path}", file=sys.stderr)
              with open(path) as handle:
                  report = json.load(handle)

              covered_lines = 0
              executable_lines = 0
              for file_path, entries in report.items():
                  combined_lines = combined.setdefault(file_path, {})
                  for entry in entries:
                      line_number = entry.get("line")
                      if line_number is None or not entry.get("isExecutable"):
                          continue

                      is_covered = entry.get("executionCount", 0) > 0
                      executable_lines += 1
                      if is_covered:
                          covered_lines += 1

                      previous = combined_lines.get(line_number, False)
                      combined_lines[line_number] = previous or is_covered

              scheme_name = os.path.basename(path).replace(".xccov.json", "")
              coverage_percent = (covered_lines / executable_lines * 100) if executable_lines else 0.0
              per_scheme.append((scheme_name, coverage_percent, covered_lines, executable_lines))
              print(
                  f"Scheme {scheme_name}: covered={covered_lines} executable={executable_lines} coverage={coverage_percent:.2f}%",
                  file=sys.stderr,
              )

          combined_executable_lines = sum(len(lines) for lines in combined.values())
          combined_covered_lines = sum(
              1 for lines in combined.values() for is_covered in lines.values() if is_covered
          )
          combined_coverage_percent = (
              combined_covered_lines / combined_executable_lines * 100
              if combined_executable_lines
              else 0.0
          )

          print(
              f"Combined coverage: covered={combined_covered_lines} executable={combined_executable_lines} coverage={combined_coverage_percent:.2f}%",
              file=sys.stderr,
          )

          print("### Combined Code Coverage")
          print()
          print("| Scope | Coverage | Covered Lines | Executable Lines |")
          print("| --- | ---: | ---: | ---: |")
          for scheme_name, coverage_percent, covered_lines, executable_lines in sorted(per_scheme):
              print(
                  f"| {scheme_name} | {coverage_percent:.2f}% | {covered_lines} | {executable_lines} |"
              )
          print(
              f"| Combined | {combined_coverage_percent:.2f}% | "
              f"{combined_covered_lines} | {combined_executable_lines} |"
          )
          PY

          echo "Combined coverage summary:"
          cat "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish combined coverage comment to pull request
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eo pipefail

          summary_file="CoverageData/combined-coverage-summary.md"
          if [ ! -f "$summary_file" ]; then
            echo "No combined coverage summary file was generated; skipping PR comment."
            exit 0
          fi

          comment_body_file="$(mktemp)"
          {
            echo '<!-- combined-code-coverage -->'
            echo
            cat "$summary_file"
          } > "$comment_body_file"

          comments_json="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            > "$comments_json"

          comment_id="$(
            python3 - "$comments_json" <<'PY'
            import json
            import sys

            marker = "<!-- combined-code-coverage -->"
            with open(sys.argv[1]) as handle:
                comments = json.load(handle)

            for comment in comments:
                if marker in comment.get("body", ""):
                    print(comment["id"])
                    break
            PY
          )"

          payload_file="$(mktemp)"
          python3 - "$comment_body_file" "$payload_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as handle:
              body = handle.read()

          with open(sys.argv[2], "w") as handle:
              json.dump({"body": body}, handle)
          PY

          if [ -n "$comment_id" ]; then
            echo "Updating existing coverage PR comment: $comment_id"
            curl -fsSL \
              -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data @"$payload_file" \
              "https://api.github.com/repos/$REPOSITORY/issues/comments/$comment_id" \
              > /dev/null
          else
            echo "Creating new coverage PR comment"
            curl -fsSL \
              -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data @"$payload_file" \
              "https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              > /dev/null
          fi

  podspec-lint:
    name: Podspec Lint (${{ matrix.podspec }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        podspec:
          - libPhoneNumber-iOS.podspec
          - libPhoneNumberGeocoding.podspec
          - libPhoneNumberShortNumber.podspec

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Ensure CocoaPods is installed
        run: |
          if ! command -v pod >/dev/null; then
            gem install cocoapods
          fi

      - name: Lint podspec
        run: pod lib lint "${{ matrix.podspec }}" --verbose
