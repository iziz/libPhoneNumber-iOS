name: GitHub Podspec Sensor Sweep

on:
  workflow_call:
    inputs:
      podspecs:
        description: |
          JSON array of podspec paths to lint.
          Example: ["libPhoneNumber-iOS.podspec", "libPhoneNumberGeocoding.podspec"]
        required: true
        type: string
      cocoapods_version:
        description: CocoaPods version to install.
        required: false
        default: latest
        type: string

jobs:
  podspec-lint:
    name: Podspec Linting (${{ matrix.podspec }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        podspec: ${{ fromJson(inputs.podspecs) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: ${{ inputs.cocoapods_version }}

      - name: Lint podspec
        run: |
          pod lib lint "${{ matrix.podspec }}" --verbose
