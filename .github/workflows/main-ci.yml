name: Main CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit

  podspec-lint:
    name: Podspec Linting
    uses: ./.github/workflows/github-podspec-sensor-sweep.yml
    with:
      podspecs: |
        libPhoneNumber-iOS.podspec
        libPhoneNumberGeocoding.podspec
        libPhoneNumberShortNumber.podspec
    secrets: inherit
