name: Main CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-core.yml
    with:
      publish_pr_comment: false
    secrets: inherit

  build-coverage-badge:
    name: Build Coverage Badge
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ needs.ci.result == 'success' }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build badge site
        env:
          COMBINED_COVERAGE_PERCENT: ${{ needs.ci.outputs.combined_coverage_percent }}
        run: |
          set -eo pipefail
          mkdir -p badge-site/badges
          touch badge-site/.nojekyll

          python3 -c '
          import json
          import os

          coverage_text = os.environ.get("COMBINED_COVERAGE_PERCENT", "").strip()
          if coverage_text:
            coverage_percent = float(coverage_text)
            if coverage_percent < 60.0:
              color = "red"
            elif coverage_percent < 75.0:
              color = "yellow"
            else:
              color = "brightgreen"
            message = f"{coverage_percent:.2f}%"
          else:
            color = "lightgrey"
            message = "n/a"

          payload = {
            "schemaVersion": 1,
            "label": "coverage",
            "message": message,
            "color": color,
          }

          with open("badge-site/badges/coverage.json", "w") as handle:
            json.dump(payload, handle)
          '

          cat > badge-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>libPhoneNumber-iOS Badges</title>
          </head>
          <body>
            <p>Badge assets for libPhoneNumber-iOS.</p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: badge-site

  deploy-coverage-badge:
    name: Deploy Coverage Badge
    runs-on: ubuntu-latest
    needs: build-coverage-badge
    if: ${{ needs.build-coverage-badge.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
