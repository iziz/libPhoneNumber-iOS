name: CI Core

on:
  workflow_call:
    inputs:
      publish_pr_comment:
        description: Publish the combined coverage summary as a PR comment.
        required: false
        default: false
        type: boolean
    outputs:
      combined_coverage_percent:
        description: Combined unit test coverage percent across all schemes.
        value: ${{ jobs.coverage-summary.outputs.combined_coverage_percent }}

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.scheme }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - libPhoneNumber
          - libPhoneNumberGeocoding
          - libPhoneNumberShortNumber

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve iPhone simulator destination
        id: destination
        uses: ./.github/actions/simctl-tricorder-selector
        with:
          device_types: iphone
          iphoneos_version: latest
          selection_mode: random-compatible

      - name: Run unit tests
        id: run-tests
        uses: ./.github/actions/xcode-tricorder-tester
        with:
          scheme: ${{ matrix.scheme }}
          xcode_container: libPhoneNumber.xcodeproj
          destination_ids: ${{ steps.destination.outputs.destination_ids }}
          simulator_jsons: ${{ steps.destination.outputs.simulator_jsons }}

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: project-unit-tests-${{ matrix.scheme }}
          path: ${{ steps.run-tests.outputs.result_bundle_directory }}

  coverage-summary:
    name: Combined Code Coverage
    runs-on: macos-latest
    needs: unit-tests
    if: always()
    outputs:
      combined_coverage_percent: ${{ steps.coverage.outputs.coverage_percent }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download unit test results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: project-unit-tests-*
          path: CoverageResults/xcresults

      - name: Generate code coverage summary
        id: coverage
        uses: ./.github/actions/xccov-warp-bubble
        with:
          xcresults_directory: CoverageResults/xcresults
          summary_file: CoverageResults/code-coverage-summary.md

      - name: Publish combined coverage comment to pull request
        if: inputs.publish_pr_comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: combined-code-coverage
          path: ${{ steps.coverage.outputs.summary_file }}
          skip_unchanged: true

  podspec-lint:
    name: Podspec Lint (${{ matrix.podspec }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        podspec:
          - libPhoneNumber-iOS.podspec
          - libPhoneNumberGeocoding.podspec
          - libPhoneNumberShortNumber.podspec

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: Lint podspec
        run: pod lib lint "${{ matrix.podspec }}" --verbose
