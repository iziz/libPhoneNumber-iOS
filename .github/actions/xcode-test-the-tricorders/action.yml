name: Xcode Test The Tricorders
description: Run xcodebuild tests against simulator destinations selected by simctl-pick-a-tricorder.

inputs:
  scheme:
    description: Xcode scheme to test.
    required: true
  xcode_container:
    description: Path to the Xcode project or workspace.
    required: true
  destination_ids:
    description: Newline-separated list of simulator destination UDIDs.
    required: true
  simulator_jsons:
    description: JSON array of simulator objects returned by simctl-pick-a-tricorder.
    required: true
  result_bundle_directory:
    description: Directory where generated xcresult bundles should be written.
    required: false
    default: TestResults
  destination_arch:
    description: Destination architecture to use with xcodebuild.
    required: false
    default: arm64
  enable_code_coverage:
    description: Value to pass to -enableCodeCoverage.
    required: false
    default: "YES"
  code_signing_allowed:
    description: Value to pass through CODE_SIGNING_ALLOWED.
    required: false
    default: "NO"
  xcodebuild_extra_args:
    description: Optional extra xcodebuild arguments.
    required: false
    default: ""

outputs:
  result_bundle_directory:
    description: Directory containing the generated xcresult bundles.
    value: ${{ steps.run.outputs.result_bundle_directory }}
  result_bundle_paths:
    description: Newline-separated list of generated xcresult bundle paths.
    value: ${{ steps.run.outputs.result_bundle_paths }}

runs:
  using: composite
  steps:
    - name: Run xcodebuild tests
      id: run
      shell: bash
      env:
        INPUT_SCHEME: ${{ inputs.scheme }}
        INPUT_XCODE_CONTAINER: ${{ inputs.xcode_container }}
        INPUT_DESTINATION_IDS: ${{ inputs.destination_ids }}
        INPUT_SIMULATOR_JSONS: ${{ inputs.simulator_jsons }}
        INPUT_RESULT_BUNDLE_DIRECTORY: ${{ inputs.result_bundle_directory }}
        INPUT_DESTINATION_ARCH: ${{ inputs.destination_arch }}
        INPUT_ENABLE_CODE_COVERAGE: ${{ inputs.enable_code_coverage }}
        INPUT_CODE_SIGNING_ALLOWED: ${{ inputs.code_signing_allowed }}
        INPUT_XCODEBUILD_EXTRA_ARGS: ${{ inputs.xcodebuild_extra_args }}
      run: |
        set -eo pipefail
        python3 "${{ github.action_path }}/run_xcode_tests.py" \
          --scheme "$INPUT_SCHEME" \
          --xcode-container "$INPUT_XCODE_CONTAINER" \
          --destination-ids "$INPUT_DESTINATION_IDS" \
          --simulator-jsons "$INPUT_SIMULATOR_JSONS" \
          --result-bundle-directory "$INPUT_RESULT_BUNDLE_DIRECTORY" \
          --destination-arch "$INPUT_DESTINATION_ARCH" \
          --enable-code-coverage "$INPUT_ENABLE_CODE_COVERAGE" \
          --code-signing-allowed "$INPUT_CODE_SIGNING_ALLOWED" \
          --xcodebuild-extra-args "$INPUT_XCODEBUILD_EXTRA_ARGS"
